name: Build LaTeX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build report and form with XeLaTeX and BibTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: |
            imdt-proposal-report.tex
            imdt-topic-work-plan.tex
          latexmk_use_xelatex: true
          texlive_version: 2025
          post_compile: |
            set -e
            python3 scripts/check-template-modes.py
      - name: Check final logs
        run: python3 scripts/check-build.py imdt-proposal-report.log imdt-topic-work-plan.log build/mode-check/*.log
      - name: Save compiled PDFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: imdt-compiled-pdfs
          path: |
            imdt-proposal-report.pdf
            imdt-topic-work-plan.pdf
            build/mode-check/writing.pdf
          if-no-files-found: error
          retention-days: 14
